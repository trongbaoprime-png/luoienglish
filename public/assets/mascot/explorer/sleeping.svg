  <!-- Arms -->
  
      <path d="M 30 68 Q 40 78 50 76" stroke="#C08A3E" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 70 68 Q 60 78 50 76" stroke="#C08A3E" stroke-width="10" stroke-linecap="round" fill="none" />
    

  <!-- Head -->
