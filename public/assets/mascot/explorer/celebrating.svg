<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="slothBody_explorer_celebrating" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C08A3E" />
      <stop offset="100%" stop-color="#8C5E28" />
    </radialGradient>
    <linearGradient id="slothMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3D2619" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Body Shadow -->
  <ellipse cx="50" cy="94" rx="28" ry="6" fill="#3D2619" opacity="0.2" />

  <!-- Sloth Pear Body -->
  <path d="M 28 45 C 18 65, 18 85, 36 94 C 50 100, 64 98, 72 90 C 82 80, 82 55, 72 45 C 65 35, 35 35, 28 45 Z" fill="url(#slothBody_explorer_celebrating)" filter="url(#softShadow)" />

  <!-- Fluffy Belly -->
  <ellipse cx="50" cy="74" rx="18" ry="16" fill="#FFF8E7" />

  <!-- Arms -->
  
      <path d="M 28 66 Q 18 46 26 36" stroke="#C08A3E" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 72 66 Q 78 48 70 38" stroke="#C08A3E" stroke-width="10" stroke-linecap="round" fill="none" />
    

  <!-- Head -->
  <circle cx="50" cy="48" r="25" fill="url(#slothBody_explorer_celebrating)" />

  <!-- Cream Face Mask -->
  <path d="M 30 50 C 30 40, 44 42, 50 46 C 56 42, 70 40, 70 50 C 70 58, 58 56, 50 54 C 42 56, 30 58, 30 50 Z" fill="url(#slothMask)" />

