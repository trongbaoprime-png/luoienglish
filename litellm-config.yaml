# LiteLLM Proxy Production Configuration
model_list:
  # 1. Primary ChatGPT Codex (Rate Limited until Aug 20)
  - model_name: chatgpt-codex
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # 2. Google Gemini Flash (Secondary Fallback for Telegram Bot)
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # 3. Claude 3.5 Sonnet (Trợ Lý Sếp & High Quality Fallback)
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # 4. OpenAI GPT-4o (JSON Structured Data)
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # 5. Groq Llama 3.3 70B (Fast Emergency Fallback)
  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 3
  timeout: 30
  fallbacks:
    - chatgpt-codex: ["gemini-pro", "claude-sonnet", "groq-llama"]
    - gpt-4o: ["gemini-pro", "claude-sonnet"]

