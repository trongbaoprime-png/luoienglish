version: '3.8'

services:
  # 1. Next.js App (Lưới CMS + miniCRM + Omnichannel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luoi_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/luoi-cms.db
      - CMS_DATABASE_URL=file:/app/luoi/cms/cms.db
      - CRM_DATABASE_URL=file:/app/luoi/minicrm/minicrm.db
      - OMNI_DATABASE_URL=file:/app/luoi/omni/omni.db
    volumes:
      - ./prisma:/app/prisma
      - ./luoi:/app/luoi
      - ./public/uploads:/app/public/uploads
    networks:
      - app_net

  # 2. LiteLLM Proxy (Enterprise Production AI Gateway)
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    container_name: litellm_proxy
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - app_net

  # 3. OmniRoute (Secondary AI Agent Router & Token Compression)
  omniroute:
    image: node:20-alpine
    container_name: omniroute_engine
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
    networks:
      - app_net

  # 4. OpenClaw (AI Web Scraping & Agent Automation)
  openclaw:
    image: python:3.11-slim
    container_name: openclaw_engine
    restart: always
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      - PORT=7000
    networks:
      - app_net

  # 5. Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
