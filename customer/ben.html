<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shopee Voucher Facebook – Chuyển đổi link nhận ưu đãi</title>
  <meta name="description" content="Dán link Shopee để chuyển đổi và sử dụng voucher Facebook độc quyền. Giao diện nhanh, gọn và tối ưu trên điện thoại.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ff5a1f">
  <style>
    :root {
      --orange:#ff5a1f;
      --orange-dark:#d9480f;
      --orange-soft:#fff7f2;
      --blue:#0f5f78;
      --text:#111827;
      --muted:#667085;
      --line:#f3d6ca;
      --card:#fff;
      --shadow:0 10px 28px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:#ffffff;
    }
    .page{max-width:980px;margin:0 auto;padding:16px}
    .hero{
      text-align:center;
      padding:18px 8px 12px;
    }
    .hero h1{
      margin:0;
      font-size:clamp(24px,5vw,38px);
      line-height:1.15;
      color:var(--blue);
      letter-spacing:-.5px;
    }
    .hero p{
      margin:10px auto 0;
      max-width:680px;
      color:var(--muted);
      line-height:1.6;
      font-size:15px;
    }
    .voucher-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:12px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .voucher-label{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 2px 10px;
    }
    .voucher-label strong{
      color:var(--orange-dark);
      font-size:16px;
    }
    .voucher-label span{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      background:#fff7ed;
      border:1px solid #fed7aa;
      padding:5px 9px;
      border-radius:999px;
    }
    .voucher-image{
      width:100%;
      height:auto;
      display:block;
      border-radius:12px;
    }
    .tool-shell{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .tool-badge{
      display:flex;
      align-items:center;
      gap:8px;
      padding:12px 14px;
      border-bottom:1px solid #f1f1f1;
      background:#fff;
      font-weight:800;
      color:var(--blue);
    }
    .tool-badge::before{
      content:"✓";
      width:24px;height:24px;
      display:grid;place-items:center;
      border-radius:50%;
      background:#eafaf0;
      color:#16a34a;
      font-size:13px;
    }
    .iframe-window{
      position:relative;
      overflow:hidden;
      height:560px;
      background:#ffffff;
    }
    .iframe-window iframe{
      position:absolute;
      left:0;
      top:-88px;
      width:100%;
      height:760px;
      border:0;
      background:#fff;
    }
    .tool-note{
      padding:11px 14px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
      background:#fff;
      border-top:1px solid #f3f4f6;
    }
    .fallback{
      margin-top:12px;
      text-align:center;
    }
    .fallback a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:0 18px;
      border-radius:999px;
      color:#fff;
      background:var(--orange);
      text-decoration:none;
      font-weight:800;
      box-shadow:0 8px 20px rgba(255,90,31,.24);
    }
    .trust{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin:16px 0 6px;
    }
    .trust div{
      background:#fff;
      border:1px solid #eee;
      border-radius:14px;
      padding:12px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
    .trust b{display:block;color:#222;font-size:13px;margin-bottom:3px}

    .voucher-time{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:14px;
      padding:14px 16px;
      background:#ffffff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
    }
    .voucher-time__icon{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#fff1e8;
      font-size:20px;
    }
    .voucher-time strong{
      display:block;
      color:var(--orange-dark);
      font-size:15px;
      margin-bottom:3px;
    }
    .voucher-time p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    @media(max-width:640px){
      .page{padding:10px}
      .hero{padding-top:10px}
      .voucher-card,.tool-shell{border-radius:16px}
      .voucher-label{align-items:flex-start}
      .voucher-label span{font-size:11px}
      .iframe-window{height:500px}
      .iframe-window iframe{
        top:-84px;
        height:700px;
      }
      .trust{grid-template-columns:1fr}
    }
  </style>
</head>

          style="color-scheme:light;background:#fff;" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
        </iframe>
      </div>
    </section>

    <section class="voucher-time" aria-live="polite">
      <div class="voucher-time__icon">⏰</div>
      <div>
        <strong>Khung giờ voucher Facebook</strong>
        <p id="voucher-time-text">Đang kiểm tra khung giờ áp dụng tiếp theo…</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const slots = [0, 9, 12, 15, 18, 20];
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      let nextHour = slots.find(hour => hour * 60 > currentMinutes);
      let dayLabel = "hôm nay";
      if (nextHour === undefined) {
        nextHour = slots[0];
        dayLabel = "ngày mai";
      }
      const el = document.getElementById("voucher-time-text");
      if (el) {
        el.innerHTML =
          'Voucher thường mở lúc 00:00, 09:00, 12:00, 15:00, 18:00 và 20:00. Mốc gần nhất: <strong>' +
          String(nextHour).padStart(2, "0") + ':00 ' + dayLabel + '</strong>.';
      }
    })();
  </script>

</body>
</html>
